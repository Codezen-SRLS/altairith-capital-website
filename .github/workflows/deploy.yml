name: Build & Deploy

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            PUBLIC_CLARITY_ID: ${{ secrets.CLARITY_ID }}
            # To enable Google Analytics, add a GA_TRACKING_ID secret (G-XXXXXXXXXX) and uncomment:
            # PUBLIC_GA_ID: ${{ secrets.GA_TRACKING_ID }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run check
            - run: npm run build

            - name: Deploy to GitHub Pages
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
                  cname: www.altairith.capital
